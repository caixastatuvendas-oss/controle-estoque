<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque - Caixas Tatu</title>
    <!-- Lib para gerar QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --bg-color: #f1f5f9;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: #0f172a; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; }

        header { background-color: var(--primary); color: white; padding: 15px; border-radius: 8px 8px 0 0; text-align: center; }
        .tabs { display: flex; background: #e2e8f0; border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; color: #475569; cursor: pointer; }
        .tab-btn.active { background: white; color: var(--primary); border-bottom: 3px solid var(--primary); }

        .tab-content { display: none; background: white; padding: 20px; border-radius: 0 0 8px 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tab-content.active { display: block; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #334155; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; font-size: 0.95rem; }
        .form-group input[readonly] { background-color: #e2e8f0; cursor: not-allowed; }

        .btn { background-color: var(--primary); color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-secondary { background-color: #475569; }

        /* Estilo para a Etiqueta 4cm x 7cm */
        #etiquetaArea { display: none; margin-top: 25px; text-align: center; }
        .etiqueta-box {
            width: 7cm;
            height: 4cm;
            border: 2px dashed #000;
            padding: 5px;
            margin: 0 auto;
            background: white;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-border-box;
        }
        .etiqueta-info { text-align: left; font-size: 10px; line-height: 1.2; font-weight: bold; }
        .etiqueta-info h3 { font-size: 12px; margin-bottom: 3px; border-bottom: 1px solid #000; }
        #qrcode { padding: 2px; }

        /* Regra de Impressão (Imprime apenas a etiqueta) */
        @media print {
            body * { visibility: hidden; }
            #etiquetaArea, #etiquetaArea * { visibility: visible; }
            #etiquetaArea { position: absolute; left: 0; top: 0; width: 7cm; height: 4cm; margin: 0; }
            .btn-print { display: none; }
        }

        .toast { display: none; padding: 10px; margin-top: 10px; border-radius: 5px; text-align: center; font-weight: bold; background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Caixas Tatu - Controle de Estoque</h2>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('entrada')">1. Entrada de Matéria-Prima</button>
        <button class="tab-btn" onclick="switchTab('mistura')">2. Ficha de Mistura / Lote</button>
    </div>

    <!-- ENTRADA -->
    <div id="tab-entrada" class="tab-content active">
        <form id="formEntrada">
            <div class="form-grid">
                <div class="form-group">
                    <label>BAG Nº (Automático)</label>
                    <input type="text" id="bagNo" readonly value="Carregando...">
                </div>
                <div class="form-group">
                    <label>Data de Entrada</label>
                    <input type="text" id="dataEntrada" readonly>
                </div>
                <div class="form-group">
                    <label>Cor</label>
                    <select id="corSelect" onchange="toggleOutro('corSelect', 'corOutro')" required>
                        <option value="">Selecione...</option>
                        <option value="Amarelo">Amarelo</option>
                        <option value="Azul">Azul</option>
                        <option value="Branco Leitoso">Branco Leitoso</option>
                        <option value="Cinza">Cinza</option>
                        <option value="Laranja">Laranja</option>
                        <option value="Lilás">Lilás</option>
                        <option value="Natural">Natural</option>
                        <option value="Preto">Preto</option>
                        <option value="Rosa">Rosa</option>
                        <option value="Roxo">Roxo</option>
                        <option value="Verde">Verde</option>
                        <option value="Verde Limão">Verde Limão</option>
                        <option value="Vermelho">Vermelho</option>
                        <option value="Virgem">Virgem</option>
                        <option value="Outras">Outras...</option>
                    </select>
                    <input type="text" id="corOutro" placeholder="Digite a cor" style="display:none; margin-top:5px;">
                </div>
                <div class="form-group">
                    <label>Matéria-Prima</label>
                    <select id="tipoSelect" onchange="toggleOutro('tipoSelect', 'tipoOutro')" required>
                        <option value="">Selecione...</option>
                        <option value="Caixaria">Caixaria</option>
                        <option value="Outra">Outra...</option>
                    </select>
                    <input type="text" id="tipoOutro" placeholder="Digite a matéria-prima" style="display:none; margin-top:5px;">
                </div>
                <div class="form-group">
                    <label>Peso (KG)</label>
                    <input type="number" step="0.01" id="peso" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Mão de Obra</label>
                    <select id="maoDeObra" required>
                        <option value="">Selecione...</option>
                        <option value="Tatu">Tatu</option>
                        <option value="Jesus">Jesus</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fornecedor</label>
                    <input type="text" id="fornecedor" required placeholder="Nome do fornecedor">
                </div>
            </div>
            <button type="submit" class="btn">Lançar e Gerar Etiqueta</button>
        </form>

        <!-- ÁREA DA ETIQUETA 4x7 CM -->
        <div id="etiquetaArea">
            <div class="etiqueta-box" id="etiquetaConteudo">
                <div class="etiqueta-info">
                    <h3>CAIXAS TATU</h3>
                    <p><b>BAG:</b> <span id="lblBag"></span></p>
                    <p><b>DATA:</b> <span id="lblData"></span></p>
                    <p><b>COR:</b> <span id="lblCor"></span></p>
                    <p><b>TIPO:</b> <span id="lblTipo"></span></p>
                    <p><b>PESO:</b> <span id="lblPeso"></span> KG</p>
                    <p><b>OP:</b> <span id="lblOp"></span></p>
                </div>
                <div id="qrcode"></div>
            </div>
            <br>
            <button class="btn btn-secondary btn-print" onclick="window.print()">🖨️ Imprimir Etiqueta (4x7 cm)</button>
        </div>
    </div>

    <!-- MISTURA -->
    <div id="tab-mistura" class="tab-content">
        <form id="formMistura">
            <div class="form-grid">
                <div class="form-group"><label>Nº Controle / Lote</label><input type="text" id="noControle" required placeholder="Ex: 1970"></div>
                <div class="form-group"><label>Data da Mistura</label><input type="text" id="dataMistura" readonly></div>
                <div class="form-group"><label>Cor Final da Mistura</label><input type="text" id="corMistura" required placeholder="Ex: Preto"></div>
            </div>

            <p><b>BAGs Utilizados:</b></p>
            <table id="tabelaBags" style="width:100%; border-collapse:collapse; margin-bottom:10px;">
                <thead>
                    <tr style="background:#f8fafc; font-size:12px;"><th>Nº BAG</th><th>QNTDD (KG)</th><th>Remover</th></tr>
                </thead>
                <tbody id="bodyBags">
                    <tr>
                        <td><input type="text" name="bag_no[]" required style="width:100%"></td>
                        <td><input type="number" step="0.01" name="bag_qtd[]" required style="width:100%"></td>
                        <td><button type="button" onclick="this.parentNode.parentNode.remove()" style="color:red;">X</button></td>
                    </tr>
                </tbody>
            </table>
            <button type="button" class="btn btn-secondary" onclick="adicionarLinhaBag()">+ Adicionar Outro BAG</button>

            <div class="form-grid" style="margin-top:15px;">
                <div class="form-group">
                    <label>Qtd Total Gerada (KG)</label>
                    <input type="number" step="0.01" id="qtdFinalKg" required>
                </div>
            </div>

            <button type="submit" class="btn">Salvar Ficha de Mistura</button>
        </form>
    </div>

    <div id="toastMessage" class="toast"></div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8iO_VEuNEa6K3lacZEIxEdV26vCbMyR9HbWS5cEq_zJhyQoATtULx5cP7JxyM2n4/exec";

    // Inicialização
    document.addEventListener("DOMContentLoaded", function() {
        const dataHoje = new Date().toLocaleDateString('pt-BR');
        document.getElementById('dataEntrada').value = dataHoje;
        document.getElementById('dataMistura').value = dataHoje;
        
        // Verifica se veio algum BAG via QR Code na URL
        const urlParams = new URLSearchParams(window.location.search);
        const bagUrl = urlParams.get('bag');
        if(bagUrl) {
            switchTab('mistura');
            document.querySelector('input[name="bag_no[]"]').value = bagUrl;
        }

        buscarProximoBag();
    });

    function buscarProximoBag() {
        fetch(APPS_SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
            document.getElementById('bagNo').value = data.proximoBag;
        })
        .catch(err => {
            document.getElementById('bagNo').value = "BAG-0001";
        });
    }

    function toggleOutro(selectId, inputId) {
        const select = document.getElementById(selectId);
        const input = document.getElementById(inputId);
        if (select.value === 'Outras' || select.value === 'Outra') {
            input.style.display = 'block';
            input.required = true;
        } else {
            input.style.display = 'none';
            input.required = false;
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        if(tab === 'entrada') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-entrada').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-mistura').classList.add('active');
        }
    }

    function adicionarLinhaBag() {
        const tbody = document.getElementById('bodyBags');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" name="bag_no[]" required style="width:100%"></td>
            <td><input type="number" step="0.01" name="bag_qtd[]" required style="width:100%"></td>
            <td><button type="button" onclick="this.parentNode.parentNode.remove()" style="color:red;">X</button></td>
        `;
        tbody.appendChild(tr);
    }

    // Processar formulário de Entrada + Gerar Etiqueta com QR Code
    document.getElementById('formEntrada').addEventListener('submit', function(e) {
        e.preventDefault();

        const bagNo = document.getElementById('bagNo').value;
        const corSelect = document.getElementById('corSelect').value;
        const cor = corSelect === 'Outras' ? document.getElementById('corOutro').value : corSelect;
        
        const tipoSelect = document.getElementById('tipoSelect').value;
        const tipo = tipoSelect === 'Outra' ? document.getElementById('tipoOutro').value : tipoSelect;

        const peso = document.getElementById('peso').value;
        const maoDeObra = document.getElementById('maoDeObra').value;
        const fornecedor = document.getElementById('fornecedor').value;
        const dataEntrada = document.getElementById('dataEntrada').value;

        const payload = {
            tipoAcao: 'ENTRADA_MATERIA_PRIMA',
            bagNo: bagNo,
            cor: cor,
            tipo: tipo,
            peso: peso,
            maoDeObra: maoDeObra,
            fornecedor: fornecedor
        };

        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            // Atualiza campos da Etiqueta
            document.getElementById('lblBag').innerText = bagNo;
            document.getElementById('lblData').innerText = dataEntrada;
            document.getElementById('lblCor').innerText = cor;
            document.getElementById('lblTipo').innerText = tipo;
            document.getElementById('lblPeso').innerText = peso;
            document.getElementById('lblOp').innerText = maoDeObra;

            // Gerar QR Code apontando para o próprio link com o parâmetro do BAG
            document.getElementById('qrcode').innerHTML = "";
            const currentUrl = window.location.href.split('?')[0];
            const qrCodeUrl = `${currentUrl}?bag=${bagNo}`;

            new QRCode(document.getElementById("qrcode"), {
                text: qrCodeUrl,
                width: 90,
                height: 90
            });

            document.getElementById('etiquetaArea').style.display = 'block';
            alert("Lançamento salvo com sucesso! Imprima a etiqueta abaixo.");
            
            // Recarrega o próximo número BAG para o próximo uso
            buscarProximoBag();
        });
    });

    // Form Mistura
    document.getElementById('formMistura').addEventListener('submit', function(e) {
        e.preventDefault();
        const bags = [];
        document.querySelectorAll('#bodyBags tr').forEach(row => {
            const inputs = row.querySelectorAll('input');
            if(inputs[0].value) {
                bags.push({ bagNo: inputs[0].value, qtdKg: inputs[1].value });
            }
        });

        const payload = {
            tipoAcao: 'FICHA_MISTURA',
            noControle: document.getElementById('noControle').value,
            corMistura: document.getElementById('corMistura').value,
            qtdFinalKg: document.getElementById('qtdFinalKg').value,
            componentes: bags
        };

        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            alert("Ficha de Mistura salva no Google Sheets!");
            document.getElementById('formMistura').reset();
        });
    });
</script>

</body>
</html>
