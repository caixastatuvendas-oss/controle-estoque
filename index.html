<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque - Caixas Tatu</title>
    <!-- Biblioteca para geração de QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --bg-color: #f1f5f9;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: #0f172a; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; }

        header { background-color: var(--primary); color: white; padding: 15px; border-radius: 8px 8px 0 0; text-align: center; }
        .tabs { display: flex; background: #e2e8f0; border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; color: #475569; cursor: pointer; }
        .tab-btn.active { background: white; color: var(--primary); border-bottom: 3px solid var(--primary); }

        .tab-content { display: none; background: white; padding: 20px; border-radius: 0 0 8px 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .tab-content.active { display: block; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #334155; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; font-size: 0.95rem; }
        .form-group input[readonly] { background-color: #e2e8f0; cursor: not-allowed; }

        .btn { background-color: var(--primary); color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-success { background-color: #16a34a; }
        .btn-secondary { background-color: #475569; }

        .painel-impressao { background: #e0f2fe; border: 1px solid #0284c7; border-radius: 8px; padding: 15px; margin-top: 20px; text-align: center; }

        /* CONFIGURAÇÃO DA FOLHA A4 PARA IMPRESSÃO DE ETIQUETAS 7x4 cm */
        #folhaA4 {
            display: none;
            width: 21cm;
            min-height: 29.7cm;
            padding: 0.5cm;
            background: white;
            margin: 20px auto;
            border: 1px solid #ccc;
        }

        .grid-a4 {
            display: grid;
            grid-template-columns: repeat(3, 7cm);
            grid-auto-rows: 4cm;
            gap: 0.2cm;
            justify-content: center;
        }

        .etiqueta-box {
            width: 7cm;
            height: 4cm;
            border: 1px dashed #000;
            padding: 4px;
            background: white;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            overflow: hidden;
        }

        .etiqueta-info { text-align: left; font-size: 9px; line-height: 1.2; font-weight: bold; width: 62%; }
        .etiqueta-info h3 { font-size: 11px; margin-bottom: 2px; border-bottom: 1px solid #000; text-align: center; }
        .qr-box { width: 36%; display: flex; justify-content: center; align-items: center; }

        @media print {
            @page { size: A4 portrait; margin: 0; }
            body { background: white; padding: 0; margin: 0; }
            body * { visibility: hidden; }
            #folhaA4, #folhaA4 * { visibility: visible; }
            #folhaA4 { position: absolute; left: 0; top: 0; width: 21cm; border: none; padding: 0.8cm 0.4cm; }
            .etiqueta-box { border: 0.5px solid #ccc; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Caixas Tatu - Controle de Estoque</h2>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('entrada')">1. Entrada de Matéria-Prima</button>
        <button class="tab-btn" onclick="switchTab('mistura')">2. Ficha de Mistura / Lote</button>
    </div>

    <!-- ABA 1: ENTRADA -->
    <div id="tab-entrada" class="tab-content active">
        <form id="formEntrada">
            <div class="form-grid">
                <div class="form-group">
                    <label>BAG Nº (Automático)</label>
                    <input type="text" id="bagNo" readonly value="Carregando...">
                </div>
                <div class="form-group">
                    <label>Data de Entrada</label>
                    <input type="text" id="dataEntrada" readonly>
                </div>
                <div class="form-group">
                    <label>Cor</label>
                    <select id="corSelect" onchange="toggleOutro('corSelect', 'corOutro')" required>
                        <option value="">Selecione...</option>
                        <option value="Amarelo">Amarelo</option>
                        <option value="Azul">Azul</option>
                        <option value="Branco Leitoso">Branco Leitoso</option>
                        <option value="Cinza">Cinza</option>
                        <option value="Laranja">Laranja</option>
                        <option value="Lilás">Lilás</option>
                        <option value="Natural">Natural</option>
                        <option value="Preto">Preto</option>
                        <option value="Rosa">Rosa</option>
                        <option value="Roxo">Roxo</option>
                        <option value="Verde">Verde</option>
                        <option value="Verde Limão">Verde Limão</option>
                        <option value="Vermelho">Vermelho</option>
                        <option value="Virgem">Virgem</option>
                        <option value="Outras">Outras...</option>
                    </select>
                    <input type="text" id="corOutro" placeholder="Digite a cor" style="display:none; margin-top:5px;">
                </div>
                <div class="form-group">
                    <label>Matéria-Prima</label>
                    <select id="tipoSelect" onchange="toggleOutro('tipoSelect', 'tipoOutro')" required>
                        <option value="">Selecione...</option>
                        <option value="Caixaria">Caixaria</option>
                        <option value="Outra">Outra...</option>
                    </select>
                    <input type="text" id="tipoOutro" placeholder="Digite a matéria-prima" style="display:none; margin-top:5px;">
                </div>
                <div class="form-group">
                    <label>Peso (KG)</label>
                    <input type="number" step="0.01" id="peso" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Mão de Obra</label>
                    <select id="maoDeObra" required>
                        <option value="">Selecione...</option>
                        <option value="Não">Não</option>
                        <option value="Jesus">Jesus</option>
                        <option value="Tatu">Tatu</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fornecedor</label>
                    <input type="text" id="fornecedor" required placeholder="Nome do fornecedor">
                </div>
            </div>
            <button type="submit" class="btn">Lançar Entrada e Adicionar à Fila</button>
        </form>

        <div class="painel-impressao">
            <h3>🖨️ Fila de Impressão de Etiquetas (A4)</h3>
            <p>Etiquetas acumuladas: <b id="qtdFila">0</b> / <b>18</b></p>
            <br>
            <button id="btnImprimirA4" class="btn btn-success" style="display:none;" onclick="imprimirFolhaA4()">🖨️ IMPRIMIR FOLHA A4 COMPLETA</button>
            <button id="btnImprimirForcado" class="btn btn-secondary" style="display:none; margin-top:5px;" onclick="imprimirFolhaA4()">Imprimir Folha Incompleta Mesmo Assim</button>
        </div>

        <div id="folhaA4">
            <div class="grid-a4" id="gridEtiquetaConteudo"></div>
        </div>
    </div>

    <!-- ABA 2: MISTURA -->
    <div id="tab-mistura" class="tab-content">
        <form id="formMistura">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nº Controle / Lote (Automático)</label>
                    <input type="text" id="noControle" readonly value="Carregando...">
                </div>
                <div class="form-group"><label>Data da Mistura</label><input type="text" id="dataMistura" readonly></div>
                <div class="form-group"><label>Cor Final da Mistura</label><input type="text" id="corMistura" required placeholder="Ex: Preto"></div>
            </div>

            <p><b>BAGs Utilizados (Apenas BAGs disponíveis no estoque):</b></p>
            <table id="tabelaBags" style="width:100%; border-collapse:collapse; margin-bottom:10px;">
                <thead>
                    <tr style="background:#f8fafc; font-size:12px;"><th>Nº BAG</th><th>QNTDD (KG)</th><th>Remover</th></tr>
                </thead>
                <tbody id="bodyBags">
                    <tr>
                        <td><input type="text" name="bag_no[]" list="listaBagsData" required style="width:100%" placeholder="Clique ou digite o BAG..."></td>
                        <td><input type="number" step="0.01" name="bag_qtd[]" class="qtd-bag" oninput="calcularSomaTotal()" required style="width:100%" placeholder="0.00"></td>
                        <td><button type="button" onclick="removerLinha(this)" style="color:red; background:none; border:none; cursor:pointer; font-weight:bold;">X</button></td>
                    </tr>
                </tbody>
            </table>
            
            <!-- Lista auto-completar com BAGs ativos -->
            <datalist id="listaBagsData"></datalist>

            <button type="button" class="btn btn-secondary" onclick="adicionarLinhaBag()">+ Adicionar Outro BAG</button>

            <div class="form-grid" style="margin-top:15px;">
                <div class="form-group">
                    <label>Qtd Total Gerada (KG) - [Soma Automática]</label>
                    <input type="number" step="0.01" id="qtdFinalKg" required placeholder="0.00" readonly style="background-color: #f8fafc; font-weight: bold; color: #1e3a8a;">
                </div>
            </div>

            <button type="submit" class="btn">Salvar Ficha de Mistura e Dar Baixa</button>
        </form>
    </div>
</div>

<script>
    // ⚠️ SUBSTITUA COM A SUA URL DO APPS SCRIPT
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAIBpjOUi_OjcqRHlhhSB5lk8JwIWa5eJa0R29o8-CzBeyR4KUglzOwrQZpFANIQU/exec";
    let filaEtiquetas = [];

    document.addEventListener("DOMContentLoaded", function() {
        const dataHoje = new Date().toLocaleDateString('pt-BR');
        document.getElementById('dataEntrada').value = dataHoje;
        document.getElementById('dataMistura').value = dataHoje;

        const urlParams = new URLSearchParams(window.location.search);
        const bagUrl = urlParams.get('bag');
        if(bagUrl) {
            switchTab('mistura');
            document.querySelector('input[name="bag_no[]"]').value = bagUrl;
        }

        buscarProximosSequenciais();
    });

    function buscarProximosSequenciais() {
        fetch(APPS_SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
            document.getElementById('bagNo').value = data.proximoBag;
            document.getElementById('noControle').value = data.proximoLote;
            
            // Atualiza o datalist apenas com BAGs SEM BAIXA
            const datalist = document.getElementById('listaBagsData');
            datalist.innerHTML = '';
            if (data.listaBags) {
                data.listaBags.forEach(bag => {
                    const option = document.createElement('option');
                    option.value = bag;
                    datalist.appendChild(option);
                });
            }
        })
        .catch(err => {
            document.getElementById('bagNo').value = "BAG-0001";
            document.getElementById('noControle').value = "LOTE-1000";
        });
    }

    // CALCULA O TOTAL EM KG AUTOMATICAMENTE
    function calcularSomaTotal() {
        let total = 0;
        document.querySelectorAll('.qtd-bag').forEach(input => {
            const valor = parseFloat(input.value);
            if (!isNaN(valor)) {
                total += valor;
            }
        });
        document.getElementById('qtdFinalKg').value = total.toFixed(2);
    }

    function toggleOutro(selectId, inputId) {
        const select = document.getElementById(selectId);
        const input = document.getElementById(inputId);
        if (select.value === 'Outras' || select.value === 'Outra') {
            input.style.display = 'block';
            input.required = true;
        } else {
            input.style.display = 'none';
            input.required = false;
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        if(tab === 'entrada') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-entrada').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-mistura').classList.add('active');
        }
    }

    function adicionarLinhaBag() {
        const tbody = document.getElementById('bodyBags');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" name="bag_no[]" list="listaBagsData" required style="width:100%" placeholder="Clique ou digite o BAG..."></td>
            <td><input type="number" step="0.01" name="bag_qtd[]" class="qtd-bag" oninput="calcularSomaTotal()" required style="width:100%" placeholder="0.00"></td>
            <td><button type="button" onclick="removerLinha(this)" style="color:red; background:none; border:none; cursor:pointer; font-weight:bold;">X</button></td>
        `;
        tbody.appendChild(tr);
    }

    function removerLinha(btn) {
        btn.parentNode.parentNode.remove();
        calcularSomaTotal();
    }

    // REGISTRO DE ENTRADA
    document.getElementById('formEntrada').addEventListener('submit', function(e) {
        e.preventDefault();

        const bagNo = document.getElementById('bagNo').value;
        const corSelect = document.getElementById('corSelect').value;
        const cor = corSelect === 'Outras' ? document.getElementById('corOutro').value : corSelect;
        
        const tipoSelect = document.getElementById('tipoSelect').value;
        const tipo = tipoSelect === 'Outra' ? document.getElementById('tipoOutro').value : tipoSelect;

        const peso = document.getElementById('peso').value;
        const maoDeObra = document.getElementById('maoDeObra').value;
        const fornecedor = document.getElementById('fornecedor').value;
        const dataEntrada = document.getElementById('dataEntrada').value;

        const payload = {
            tipoAcao: 'ENTRADA_MATERIA_PRIMA',
            bagNo: bagNo,
            cor: cor,
            tipo: tipo,
            peso: peso,
            maoDeObra: maoDeObra,
            fornecedor: fornecedor
        };

        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            filaEtiquetas.push({ bagNo, cor, tipo, peso, maoDeObra, dataEntrada });
            atualizarFilaImpressao();
            alert(`BAG ${bagNo} gravado! Fila atual: ${filaEtiquetas.length}/18 etiquetas.`);
            
            document.getElementById('peso').value = '';
            document.getElementById('fornecedor').value = '';
            buscarProximosSequenciais();
        });
    });

    function atualizarFilaImpressao() {
        const qtd = filaEtiquetas.length;
        document.getElementById('qtdFila').innerText = qtd;

        if (qtd > 0) document.getElementById('btnImprimirForcado').style.display = 'inline-block';
        if (qtd >= 18) document.getElementById('btnImprimirA4').style.display = 'inline-block';
    }

    function imprimirFolhaA4() {
        const grid = document.getElementById('gridEtiquetaConteudo');
        grid.innerHTML = '';
        const currentUrl = window.location.href.split('?')[0];

        filaEtiquetas.forEach((item, index) => {
            const idQr = `qr_${index}`;
            const box = document.createElement('div');
            box.className = 'etiqueta-box';
            box.innerHTML = `
                <div class="etiqueta-info">
                    <h3>CAIXAS TATU</h3>
                    <p><b>BAG:</b> ${item.bagNo}</p>
                    <p><b>DATA:</b> ${item.dataEntrada}</p>
                    <p><b>COR:</b> ${item.cor}</p>
                    <p><b>TIPO:</b> ${item.tipo}</p>
                    <p><b>PESO:</b> ${item.peso} KG</p>
                    <p><b>MO:</b> ${item.maoDeObra}</p>
                </div>
                <div class="qr-box" id="${idQr}"></div>
            `;
            grid.appendChild(box);

            new QRCode(document.getElementById(idQr), {
                text: `${currentUrl}?bag=${item.bagNo}`,
                width: 65,
                height: 65
            });
        });

        document.getElementById('folhaA4').style.display = 'block';

        setTimeout(() => {
            window.print();
            if (confirm("Deseja limpar a fila de etiquetas impressas?")) {
                filaEtiquetas = [];
                atualizarFilaImpressao();
                document.getElementById('folhaA4').style.display = 'none';
                document.getElementById('btnImprimirA4').style.display = 'none';
                document.getElementById('btnImprimirForcado').style.display = 'none';
            }
        }, 500);
    }

    // REGISTRO DE MISTURA (COM BAIXA NO ESTOQUE)
    document.getElementById('formMistura').addEventListener('submit', function(e) {
        e.preventDefault();
        const bags = [];
        document.querySelectorAll('#bodyBags tr').forEach(row => {
            const inputs = row.querySelectorAll('input');
            if(inputs[0].value) {
                bags.push({ bagNo: inputs[0].value, qtdKg: inputs[1].value });
            }
        });

        const payload = {
            tipoAcao: 'FICHA_MISTURA',
            noControle: document.getElementById('noControle').value,
            corMistura: document.getElementById('corMistura').value,
            qtdFinalKg: document.getElementById('qtdFinalKg').value,
            componentes: bags
        };

        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            alert("Ficha de Mistura salva! Baixa dos BAGs realizada com sucesso.");
            document.getElementById('formMistura').reset();
            
            // Reseta a tabela para 1 linha
            document.getElementById('bodyBags').innerHTML = `
                <tr>
                    <td><input type="text" name="bag_no[]" list="listaBagsData" required style="width:100%" placeholder="Clique ou digite o BAG..."></td>
                    <td><input type="number" step="0.01" name="bag_qtd[]" class="qtd-bag" oninput="calcularSomaTotal()" required style="width:100%" placeholder="0.00"></td>
                    <td><button type="button" onclick="removerLinha(this)" style="color:red; background:none; border:none; cursor:pointer; font-weight:bold;">X</button></td>
                </tr>
            `;
            document.getElementById('qtdFinalKg').value = '';
            
            // Recarrega os números sequenciais e remove da lista os BAGs utilizados
            buscarProximosSequenciais();
        });
    });
</script>

</body>
</html>
